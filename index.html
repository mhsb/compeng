<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی انگلیسی با کامپیوتر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#ffffff;--ink:#2b2340;--mut:#6b6485;--p:#6c5ce7;--g:#00a383;--r:#d63031;--y:#fdcb6e;--line:#eadfc6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1830;--card:#272244;--ink:#f3efff;--mut:#b4acd4;--line:#3a3463;--g:#38d9b0;--r:#ff7675}}
:root[data-theme="dark"]{--bg:#1b1830;--card:#272244;--ink:#f3efff;--mut:#b4acd4;--line:#3a3463;--g:#38d9b0;--r:#ff7675}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:17px}
#app{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:1.6rem;margin:.4em 0;text-align:center}h2{font-size:1.15rem;margin:.2em 0 .6em}
.mut{color:var(--mut);text-align:center;margin:0 0 12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;color:var(--ink);font-family:inherit}
.c{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:1rem}
.big{font-size:2.6rem}.huge{font-size:4.5rem;font-weight:900;color:var(--p);direction:ltr;line-height:1.1;margin:6px 0}
.btn{background:var(--p);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn:active{transform:scale(.96)}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
textarea{width:100%;min-height:90px;font:12px monospace;direction:ltr;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.av{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.av-b{font-size:1.8rem;background:var(--bg);border:3px solid transparent;border-radius:14px;cursor:pointer}
.av-b.on{border-color:var(--p)}
.lesson{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:start}
.lesson .big{flex:none}.lesson div{flex:1}
.pb,.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;flex:1}
.pb i,.bar i{display:block;height:100%;background:var(--g);border-radius:8px;transition:width .4s}
.top{display:flex;gap:10px;align-items:center}
.en{direction:ltr;unicode-bidi:isolate}
.kb{direction:ltr;display:flex;flex-direction:column;gap:4px;margin:12px 0}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;max-width:46px;height:44px;border-radius:9px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 1rem Vazirmatn,sans-serif;cursor:pointer;padding:0}
.k.hint{background:var(--y);color:#2b2340;animation:bl .6s infinite alternate}
@keyframes bl{to{transform:scale(1.15)}}
.bxs{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:wrap;margin:10px 0}
.bx{width:40px;height:50px;border:3px dashed var(--line);border-radius:10px;font:900 1.7rem sans-serif;display:flex;align-items:center;justify-content:center;color:var(--g)}
.bx.cur{border-color:var(--p);border-style:solid}.bx.ok{border-style:solid;border-color:var(--g)}
.ch{display:block;width:100%;font-size:1.3rem;direction:ltr;background:var(--card);color:var(--ink);border:3px solid var(--line)}
.ch.right{background:var(--g);color:#fff;border-color:var(--g)}.ch.bad{opacity:.35}
.tl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;min-height:52px;margin:8px 0}
.tl .btn{font-size:1.15rem}
.line{border-bottom:3px dashed var(--line);padding-bottom:6px}
.msg{text-align:center;font-weight:700;min-height:1.6em}.msg.ok{color:var(--g)}.msg.no{color:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;margin-top:8px}
.chip{padding:2px 9px;border-radius:10px;background:var(--line);font-size:.9rem}.chip.on{background:var(--g);color:#fff}
.row{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
var LS='kidEngPC1',S=null,G=null;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||!Array.isArray(S.users))S={users:[],cur:null};
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function U(){return S.users.find(function(u){return u.id===S.cur})}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function set(h){$('#app').innerHTML=h}
function sp(t){try{speechSynthesis.cancel();var m=new SpeechSynthesisUtterance(t);m.lang='en-US';m.rate=.8;speechSynthesis.speak(m)}catch(e){}}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}

var AV=['🦊','🐼','🦁','🐯','🐸','🐵','🦄','🐙'];
var ABC='abcdefghijklmnopqrstuvwxyz'.split('');
var W=[['mouse','🖱️','ماوس'],['keyboard','⌨️','صفحه‌کلید'],['screen','🖥️','صفحه‌نمایش'],['laptop','💻','لپ‌تاپ'],['click','👆','کلیک'],['key','🔑','کلید'],['folder','📁','پوشه'],['file','📄','فایل'],['print','🖨️','چاپ'],['save','💾','ذخیره'],['search','🔍','جستجو'],['internet','🌐','اینترنت'],['email','✉️','ایمیل'],['camera','📷','دوربین'],['music','🎵','موزیک'],['game','🎮','بازی']];
var SEN=[['Click the mouse','روی ماوس کلیک کن'],['Press the key','کلید را فشار بده'],['Open the file','فایل را باز کن'],['Save the file','فایل را ذخیره کن'],['Type your name','اسمت را تایپ کن'],['Look at the screen','به صفحه‌نمایش نگاه کن'],['Use the keyboard','از صفحه‌کلید استفاده کن'],['Search the internet','در اینترنت جستجو کن'],['Print the file','فایل را چاپ کن'],['Open the folder','پوشه را باز کن']];
var LES=[{id:'L',t:'حروف روی کیبورد',d:'کلید حرف را پیدا کن',e:'🔤',n:26,q:8},{id:'W',t:'کلمه‌های کامپیوتر',d:'تصویر را به کلمه وصل کن',e:'🖥️',n:W.length,q:8},{id:'T',t:'تایپ کردن کلمه‌ها',d:'کلمه را با کیبورد تایپ کن',e:'⌨️',n:W.length,q:5},{id:'S',t:'ساختن جمله',d:'کلمه‌ها را مرتب کن',e:'🧩',n:SEN.length,q:5}];
function lesson(id){return LES.find(function(l){return l.id===id})}
function done(u,l,i){return (u.p[l+':'+i]||0)>0}
function pct(u,l){var L=lesson(l),c=0,i;for(i=0;i<L.n;i++){if(done(u,l,l=='L'?ABC[i]:i))c++}return Math.round(c/L.n*100)}
function total(u){return Math.round(LES.reduce(function(a,l){return a+pct(u,l.id)},0)/LES.length)}

/* ---------- users ---------- */
function vUsers(){
 G=null;S.cur=null;
 set('<h1>🎮 انگلیسی با کامپیوتر</h1><p class="mut">اسمت رو انتخاب کن یا بازیکن جدید بساز</p>'+
 '<div class="grid">'+S.users.map(function(u){return '<button class="card pick" onclick="login(\''+u.id+'\')"><span class="big">'+u.av+'</span><b>'+esc(u.name)+'</b><small>⭐ '+u.stars+' · '+total(u)+'٪</small></button>'}).join('')+'</div>'+
 '<div class="card"><h2>➕ بازیکن جدید</h2><input id="nm" maxlength="20" placeholder="اسمت چیه؟">'+
 '<div class="av">'+AV.map(function(a,i){return '<button class="av-b'+(i?'':' on')+'" onclick="pickAv(this)">'+a+'</button>'}).join('')+'</div>'+
 '<button class="btn" onclick="addU()">بسازیم ✨</button></div>'+
 '<button class="btn ghost" onclick="vBk()">📦 پشتیبان‌گیری و بازیابی پیشرفت</button>');
}
function pickAv(b){document.querySelectorAll('.av-b').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}
function addU(){
 var n=$('#nm').value.trim();if(!n){$('#nm').focus();return}
 var a=$('.av-b.on').textContent,u={id:Date.now().toString(36),name:n,av:a,stars:0,p:{},best:{}};
 S.users.push(u);S.cur=u.id;save();vHome();
}
function login(id){S.cur=id;save();vHome()}

/* ---------- home ---------- */
function vHome(){
 var u=U();if(!u)return vUsers();G=null;
 set('<div class="row"><span class="big">'+u.av+'</span><div style="flex:1"><b>سلام '+esc(u.name)+'!</b><br><small class="mut">⭐ '+u.stars+' ستاره</small></div><button class="btn ghost sm" onclick="vUsers()">🔄 تغییر بازیکن</button></div>'+
 '<div class="card"><div class="row"><b>پیشرفت کلی</b><div class="pb"><i style="width:'+total(u)+'%"></i></div><b>'+total(u)+'٪</b></div></div>'+
 LES.map(function(l){var p=pct(u,l.id);return '<button class="card lesson" onclick="start(\''+l.id+'\')"><span class="big">'+l.e+'</span><div><b>'+l.t+'</b><br><small class="mut">'+l.d+'</small><div class="row" style="margin-top:6px"><div class="pb"><i style="width:'+p+'%"></i></div><small>'+p+'٪</small></div></div></button>'}).join('')+
 '<button class="btn ghost" onclick="vProg()">📊 جزئیات پیشرفت و پشتیبان</button>');
}

/* ---------- game ---------- */
function start(l){
 var u=U(),L=lesson(l),pool=l=='L'?ABC:W.map(function(_,i){return i});
 if(l=='S')pool=SEN.map(function(_,i){return i});
 var items=pool.map(function(x){return[x,(u.p[l+':'+x]||0)+Math.random()*1.5]}).sort(function(a,b){return a[1]-b[1]}).slice(0,L.q).map(function(a){return a[0]});
 G={l:l,items:items,i:0,miss:0};q();
}
function q(){
 var l=G.l,x=G.items[G.i];G.pos=0;G.hint=0;G.sel=[];G.dis=[];G.fb=0;G.msg='';G.lock=0;
 if(l=='W'){var o=shuf(W.map(function(_,i){return i}).filter(function(i){return i!=x})).slice(0,2);G.ch=shuf([x].concat(o));sp(W[x][0])}
 if(l=='T')sp(W[x][0]);
 if(l=='S'){G.tiles=shuf(SEN[x][0].split(' ').map(function(w,i){return{w:w,i:i}}));sp(SEN[x][0])}
 if(l=='L')sp(x.toUpperCase());
 vGame();
}
function kb(t){
 return '<div class="kb">'+['qwertyuiop','asdfghjkl','zxcvbnm'].map(function(r){return '<div class="kr">'+r.split('').map(function(k){return '<button class="k'+(G.hint>=2&&k==t?' hint':'')+'" onclick="press(\''+k+'\')">'+k.toUpperCase()+'</button>'}).join('')+'</div>'}).join('')+'</div>';
}
function vGame(){
 var l=G.l,x=G.items[G.i],b='';
 var top='<div class="top"><button class="btn ghost sm" onclick="vHome()">⬅ خروج</button><div class="bar"><i style="width:'+(G.i/G.items.length*100)+'%"></i></div><small>'+(G.i+1)+'/'+G.items.length+'</small></div>';
 if(l=='L'){
  b='<div class="card c"><p>این کلید را روی کیبورد پیدا کن و بزن:</p><div class="huge">'+x.toUpperCase()+' '+x+'</div><button class="btn sm" onclick="sp(\''+x.toUpperCase()+'\')">🔊 بشنو</button></div>'+kb(x);
 }else if(l=='T'){
  var w=W[x];
  b='<div class="card c"><div class="big" style="font-size:4rem">'+w[1]+'</div><p>'+w[2]+'</p><button class="btn sm" onclick="sp(\''+w[0]+'\')">🔊 بشنو</button>'+
  '<div class="bxs">'+w[0].split('').map(function(c,i){return '<span class="bx '+(i<G.pos?'ok':i==G.pos?'cur':'')+'">'+(i<G.pos?c:'')+'</span>'}).join('')+'</div></div>'+(G.fb?'':kb(w[0][G.pos]));
 }else if(l=='W'){
  var w2=W[x];
  b='<div class="card c"><div style="font-size:5rem">'+w2[1]+'</div><button class="btn sm" onclick="sp(\''+w2[0]+'\')">🔊 بشنو</button><p>کدام کلمه درسته؟</p></div>'+
  G.ch.map(function(c,i){return '<button class="btn ch'+(G.fb&&c==x?' right':'')+(G.dis.indexOf(i)>=0?' bad':'')+'" onclick="pickW('+i+')">'+W[c][0]+'</button>'}).join('');
 }else{
  var s=SEN[x];
  b='<div class="card c"><p>جمله را بساز: <b>'+s[1]+'</b></p><button class="btn sm" onclick="sp(\''+s[0]+'\')">🔊 بشنو</button>'+
  '<div class="tl line">'+G.sel.map(function(t){return '<button class="btn" style="background:var(--g)" onclick="unTile('+t+')">'+G.tiles[t].w+'</button>'}).join('')+'</div>'+
  '<div class="tl">'+G.tiles.map(function(t,i){return G.sel.indexOf(i)>=0?'':'<button class="btn" onclick="tile('+i+')">'+t.w+'</button>'}).join('')+'</div></div>';
 }
 var fbt=G.fb?'✅ آفرین! '+(l=='S'?SEN[x][0]:l=='L'?'':W[x][0]+' = '+W[x][2]):G.msg;
 set(top+b+'<div class="msg '+(G.fb?'ok':'no')+'">'+fbt+'</div>');
}
function ok(){
 var u=U(),k=G.l+':'+G.items[G.i];
 u.p[k]=(u.p[k]||0)+1;save();G.lock=1;G.fb=1;vGame();
 setTimeout(function(){if(!G)return;G.i++;G.i>=G.items.length?fin():q()},1000);
}
function bad(){G.miss++;G.hint++;G.msg='❌ دوباره امتحان کن';vGame()}
function press(k){
 if(!G||G.lock||G.done)return;var x=G.items[G.i];
 if(G.l=='L'){k==x?ok():bad()}
 else if(G.l=='T'){var w=W[x][0];if(k==w[G.pos]){G.pos++;G.msg='';G.hint=0;G.pos>=w.length?ok():vGame()}else bad()}
}
function pickW(i){
 if(G.lock||G.dis.indexOf(i)>=0)return;
 if(G.ch[i]==G.items[G.i])ok();else{G.dis.push(i);bad()}
}
function tile(i){if(G.lock)return;G.sel.push(i);G.msg='';var n=SEN[G.items[G.i]][0].split(' ');
 if(G.sel.length==n.length){var r=G.sel.map(function(t){return G.tiles[t].w}).join(' ');
  if(r==SEN[G.items[G.i]][0])ok();else{G.sel=[];bad()}}else vGame()}
function unTile(t){if(G.lock)return;G.sel=G.sel.filter(function(x){return x!=t});vGame()}
function fin(){
 var u=U(),s=G.miss==0?3:G.miss<=2?2:1,l=G.l;
 u.stars+=s;u.best[l]=Math.max(u.best[l]||0,s);save();G.done=1;
 set('<div class="card c"><div class="big" style="font-size:4rem">🎉</div><h1>تمام شد!</h1><div class="big">'+'⭐'.repeat(s)+'</div><p>'+(G.miss?G.miss+' اشتباه داشتی؛ دفعه بعد بهتر می‌شه!':'بدون هیچ اشتباهی! عالی بود!')+'</p>'+
 '<button class="btn" onclick="start(\''+l+'\')">🔁 دوباره</button><button class="btn ghost" onclick="vHome()">🏠 صفحه اصلی</button></div>');
}
document.addEventListener('keydown',function(e){
 if(!G||G.done||/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key.length==1&&/[a-z]/i.test(e.key)){e.preventDefault();press(e.key.toLowerCase())}
});

/* ---------- progress & backup ---------- */
var delAsk=0;
function vProg(){
 var u=U();if(!u)return vUsers();delAsk=0;
 var ch=function(l,i,t){return '<span class="chip'+(done(u,l,i)?' on':'')+'">'+t+'</span>'};
 set('<div class="top"><button class="btn ghost sm" onclick="vHome()">⬅ برگشت</button><h2 style="margin:0">📊 پیشرفت '+esc(u.name)+'</h2></div>'+
 '<div class="card"><b>حروف ('+pct(u,'L')+'٪)</b><div class="chips">'+ABC.map(function(c){return ch('L',c,c.toUpperCase())}).join('')+'</div></div>'+
 '<div class="card"><b>کلمه‌ها ('+pct(u,'W')+'٪ دیده · '+pct(u,'T')+'٪ تایپ‌شده)</b><div class="chips">'+W.map(function(w,i){return ch('W',i,w[0])}).join('')+'</div></div>'+
 '<div class="card"><b>جمله‌ها ('+pct(u,'S')+'٪)</b><div class="chips">'+SEN.map(function(s,i){return ch('S',i,s[0])}).join('')+'</div></div>'+
 '<button class="btn ghost" onclick="vBk()">📦 پشتیبان‌گیری و بازیابی</button> <button class="btn ghost" id="dl" onclick="delU()">🗑️ حذف این بازیکن</button>');
}
function delU(){
 if(!delAsk){delAsk=1;$('#dl').textContent='⚠️ مطمئنی؟ دوباره بزن';return}
 S.users=S.users.filter(function(u){return u.id!==S.cur});S.cur=null;save();vUsers();
}
function vBk(){
 set('<div class="top"><button class="btn ghost sm" onclick="'+(U()?'vHome()':'vUsers()')+'">⬅ برگشت</button><h2 style="margin:0">📦 پشتیبان‌گیری</h2></div>'+
 '<div class="card"><p>پیشرفت همهٔ بازیکن‌ها فقط روی همین مرورگر ذخیره می‌شود. این کد را کپی و جایی نگه دار (مثلاً در یک فایل متنی یا پیام به خودت).</p>'+
 '<textarea id="ex" readonly>'+esc(JSON.stringify(S.users))+'</textarea><button class="btn" onclick="cp()">📋 کپی کد پشتیبان</button></div>'+
 '<div class="card"><p>برای بازیابی، کد پشتیبان را اینجا بچسبان:</p><textarea id="im" placeholder="[{...}]"></textarea><button class="btn" onclick="rs()">♻️ بازیابی</button></div><div class="msg" id="bm"></div>');
}
function cp(){var t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}$('#bm').className='msg ok';$('#bm').textContent='✅ کپی شد'}
function rs(){
 var m=$('#bm');
 try{
  var a=JSON.parse($('#im').value.trim());if(!Array.isArray(a))throw 0;var c=0;
  a.forEach(function(n){if(!n||!n.id||!n.name)return;n.p=n.p||{};n.best=n.best||{};n.stars=n.stars||0;n.av=n.av||'🙂';
   var i=S.users.findIndex(function(u){return u.id===n.id});if(i<0)S.users.push(n);else S.users[i]=n;c++});
  save();m.className='msg ok';m.textContent='✅ '+c+' بازیکن بازیابی شد';
 }catch(e){m.className='msg no';m.textContent='❌ کد معتبر نیست'}
}

/* ===== 110 levels: 8 weeks, 2 per day ===== */
function R(a,b){var r=[];for(;a<=b;a++)r.push(a);return r}
W=[['yes','✅','بله'],['no','❌','نه'],['OK','🆗','باشه'],['on','🟢','روشن'],['off','⚫','خاموش'],['up','⬆️','بالا'],['down','⬇️','پایین'],['go','🏃','برو'],['stop','🛑','بایست'],['start','🏁','شروع'],['wait','⏳','صبر کن'],
['mouse','🖱️','ماوس'],['keyboard','⌨️','صفحه‌کلید'],['screen','🖥️','صفحه‌نمایش'],['laptop','💻','لپ‌تاپ'],['key','🔑','کلید'],['button','🔘','دکمه'],['printer','🖨️','چاپگر'],['camera','📷','دوربین'],['speaker','🔊','بلندگو'],['mic','🎤','میکروفون'],
['click','👆','کلیک'],['open','📂','باز کن'],['close','🚪','ببند'],['save','💾','ذخیره'],['print','🖨️','چاپ'],['copy','📋','کپی'],['paste','📌','چسباندن'],['delete','🗑️','حذف'],['search','🔍','جستجو'],['type','⌨️','تایپ'],['play','▶️','پخش'],['pause','⏸️','توقف'],
