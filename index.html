:root{--bg:#fff7e6;--card:#ffffff;--ink:#2b2340;--mut:#6b6485;--p:#6c5ce7;--g:#00a383;--r:#d63031;--y:#fdcb6e;--line:#eadfc6;--f0:#e84393;--f1:#e17055;--f2:#f1c40f;--f3:#00b894}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1830;--card:#272244;--ink:#f3efff;--mut:#b4acd4;--line:#3a3463;--g:#38d9b0;--r:#ff7675}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;font-size:17px;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#app{max-width:720px;margin:0 auto;padding:14px 14px 76px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
h1{font-size:1.6rem;margin:.4em 0;text-align:center}h2{font-size:1.15rem;margin:.2em 0 .6em}
.mut{color:var(--mut);margin:0 0 10px}.c{text-align:center}p.mut.c,.mut.c{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;color:var(--ink);font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:1rem}
.big{font-size:2.6rem}.huge{font-size:4.5rem;font-weight:900;color:var(--p);direction:ltr;line-height:1.1;margin:6px 0}
.btn{background:var(--p);color:#fff;border:0;border-radius:14px;padding:12px 18px;min-height:46px;font:inherit;font-weight:700;cursor:pointer;margin:4px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem;min-height:40px}
.btn:active{transform:scale(.96)}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
textarea{width:100%;min-height:80px;font:12px monospace;direction:ltr;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.av{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.av-b{font-size:1.8rem;background:var(--bg);border:3px solid transparent;border-radius:14px;cursor:pointer;min-width:48px;min-height:48px}
.av-b.on{border-color:var(--p)}
.pb,.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;flex:1}
.pb i,.bar i{display:block;height:100%;background:var(--g);border-radius:8px;transition:width .4s}
.top{display:flex;gap:10px;align-items:center}
.row{display:flex;gap:10px;align-items:center}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
/* guide */
.guide{display:flex;gap:10px;align-items:center;margin:8px 0}
.gd{width:68px;height:68px;flex:none;line-height:0}
.bub{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;flex:1;font-weight:700;font-size:.98rem;position:relative}
/* keyboard */
.kb{direction:ltr;display:flex;flex-direction:column;gap:5px;margin:12px 0}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;min-width:0;max-width:48px;height:46px;border-radius:9px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);font:700 1rem "Segoe UI",Tahoma,sans-serif;cursor:pointer;padding:0;position:relative}
.k.f0{border-bottom-color:var(--f0)}.k.f1{border-bottom-color:var(--f1)}.k.f2{border-bottom-color:var(--f2)}.k.f3{border-bottom-color:var(--f3)}
.k.bump::after{content:"";position:absolute;left:35%;right:35%;bottom:4px;height:3px;border-radius:2px;background:var(--mut)}
.k.hint{background:var(--y);color:#2b2340;animation:bl .6s infinite alternate}
.lg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:.8rem;color:var(--mut);margin:0 0 6px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin-inline-end:4px}
@keyframes bl{to{transform:scale(1.15)}}
/* letter boxes */
.bxs{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:wrap;margin:10px 0}
.bx{width:40px;height:50px;border:3px dashed var(--line);border-radius:10px;font:900 1.7rem "Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;color:var(--g)}
.bx.cur{border-color:var(--p);border-style:solid}.bx.ok{border-style:solid;border-color:var(--g)}
.bxs.sm{display:inline-flex;margin:0 4px;vertical-align:middle}.bxs.sm .bx{width:30px;height:38px;font-size:1.3rem}
.ch{display:block;width:calc(100% - 8px);font-size:1.3rem;direction:ltr;background:var(--card);color:var(--ink);border:3px solid var(--line)}
.ch.letter{font-size:2rem}
.ch.right{background:var(--g);color:#fff;border-color:var(--g)}.ch.bad{opacity:.35}
.tl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;min-height:56px;margin:8px 0}
.tl .btn{font-size:1.15rem}
.line{border-bottom:3px dashed var(--line);padding-bottom:6px}
.msg{text-align:center;font-weight:700;min-height:1.6em}.msg.ok{color:var(--g)}.msg.no{color:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;margin-top:8px}
.chip{padding:2px 9px;border-radius:10px;background:var(--line);font-size:.9rem}.chip.on{background:var(--g);color:#fff}.chip.warn{background:var(--y);color:#2b2340}
.sent{font-size:1.5rem;font-weight:700;direction:ltr;margin:8px 0;line-height:2.2}
.gap{display:inline-block;min-width:70px;border-bottom:4px solid var(--p);margin:0 4px}
.fill{color:var(--g)}
/* pictures */
.emo{font-size:4.5rem;line-height:1.1;display:inline-block}
.pic{min-height:84px;display:flex;align-items:center;justify-content:center}
.pic.s .emo{font-size:3rem}.pic.s{min-height:56px}
.cap{display:inline-block;min-width:64px;padding:10px 16px;border:3px solid var(--line);border-bottom-width:7px;border-radius:12px;background:var(--card);font:700 1.5rem/1 "Segoe UI",Tahoma,sans-serif;direction:ltr;color:var(--ink)}
.winpic{display:inline-block;width:110px;height:76px;border:4px solid var(--ink);border-radius:8px;position:relative;background:var(--card);overflow:hidden}
.winpic::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:var(--p)}
.winpic b{position:absolute;top:0;right:6px;color:#fff;font-size:.9rem;line-height:20px}
.pic.s .cap{font-size:1rem;padding:6px 10px;min-width:44px}.pic.s .winpic{width:70px;height:48px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.mc{min-height:76px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);font:700 1rem "Segoe UI",Tahoma,sans-serif;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center}
.mc.back{background:var(--p);color:#fff;font-size:1.6rem;border-color:var(--p)}
.mc.open{border-color:var(--y)}.mc.gone{background:var(--g);color:#fff;border-color:var(--g);opacity:.75}
.mc .emo{font-size:2.2rem}.mc .cap{font-size:.9rem;padding:4px 6px;min-width:0}.mc .winpic{width:56px;height:38px}
/* map */
.isl{padding:0;overflow:hidden}
.isl summary{list-style:none;cursor:pointer;padding:14px;display:flex;gap:10px;align-items:center}
.isl summary::-webkit-details-marker{display:none}
.isl summary .big{font-size:2.2rem}
.isl .in{padding:0 14px 14px}
.path{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lvw{display:flex;justify-content:center;transform:translateX(var(--o,0))}
.lv{width:68px;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;height:68px;font:700 .95rem Vazirmatn,Tahoma,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.lv .ic{font-size:1.2rem}.lv small{font-size:.6rem;min-height:.8rem}
.lv.dn{background:var(--g);color:#fff;border-color:var(--g)}
.lv.cu{border-color:var(--p);background:var(--p);color:#fff;animation:bl .8s infinite alternate}
.lv.lk{opacity:.45;cursor:default}
.lv.boss{width:82px;height:82px;border-radius:24px}
.dots{font-size:1.8rem;letter-spacing:6px}
.tag{display:inline-block;background:var(--line);border-radius:10px;padding:2px 9px;font-size:.78rem;margin:2px 0}
/* report */
.bars{display:flex;gap:8px;align-items:flex-end;height:110px;direction:ltr}
.bars div{flex:1;text-align:center;font-size:.75rem;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--p);border-radius:6px 6px 0 0;min-height:3px}
/* effects */
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}.shake{animation:shk .4s;border-color:var(--r)!important}.jump{animation:jmp .6s;border-color:var(--g)!important}.bnc{display:inline-block;animation:bnc .9s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes jmp{30%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0) scale(.98)}}
@keyframes bnc{50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes fl{50%{transform:translateY(-6px) rotate(-6deg)}}
@keyframes mv{to{background-position:20px 0}}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
@keyframes wob{50%{transform:rotate(-3deg) scale(1.05)}}
.bar i,.pb i{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:20px 20px;animation:mv 1s linear infinite}
.sh{width:100%;height:100%;overflow:visible}.sh.happy,.sh.cheer{animation:hop .7s ease-in-out infinite}.sh.cheer{animation-duration:.45s}.sh.sad{animation:sway 2.6s ease-in-out infinite}.sh .tear{animation:tear 1.5s ease-in infinite}.sh .sp{animation:twk .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

['click','👆','کلیک کن','v'],['open','📂','باز کن','v'],['close','🚪','ببند','v'],['save','💾','ذخیره کن','v'],['print','📃','چاپ کن','v'],['copy','📋','کپی کن','v'],['paste','📥','بچسبان','v'],['delete','🗑️','حذف کن','v'],['search','🔍','جستجو کن','v'],['type','✍️','تایپ کن','v'],['play','▶️','پخش کن','v'],['pause','⏸️','مکث کن','v'],['press','👇','فشار بده','v'],
['enter','⌨️','اینتر','n',CAP('Enter ↵')],['space','⌨️','فاصله','n',CAP('Space ␣')],['shift','⌨️','شیفت','n',CAP('⇧ Shift')],['tab','⌨️','تب','n',CAP('Tab ⇥')],['esc','⌨️','خروج','n',CAP('Esc')],['ctrl','⌨️','کنترل','n',CAP('Ctrl')],
['edit','✏️','ویرایش','v'],['view','👁️','نمایش','v'],['help','🆘','کمک','v'],['menu','☰','منو','n',CAP('☰')],['home','🏠','خانه','n'],['back','◀️','برگشت','v'],['next','⏭️','بعدی','v'],['cancel','✖️','لغو','v'],['error','⚠️','خطا','n'],

const SEN=[

['Look at the screen','به صفحه‌نمایش نگاه کن',3],['Use the keyboard','از صفحه‌کلید استفاده کن',2],['Search the internet','در اینترنت جستجو کن',0],['Press the Enter key','کلید اینتر را بزن',0],['Do you want to save','می‌خواهی ذخیره کنی؟',4],

{t:'کلمه‌های پایه',ic:'🌋',W:wi('yes,no,OK,on,off,up,down,go,stop,start,wait'),s:'WFYWMYBMBDTYP',br:'پل ۲ (حرف ← کلمه): ببین و تایپ کن ← حرف جاافتاده ← ساختن کلمه ← تایپ از روی تصویر',o:'با کارت‌ها «چراغ راهنما» بازی کن: go / stop / wait.'},

const IC={L:'🔤',H:'👂',U:'🔡',F:'🔎',M:'❓',B:'🧱',Y:'👀',T:'⌨️',W:'🖼️',D:'🎧',P:'🃏',C:'📝',E:'✏️',O:'🧩',S:'🔀',X:'🏆'};

const QN={L:8,H:8,U:8,F:7,M:7,B:6,Y:5,T:5,W:8,D:8,P:2,C:6,E:5,O:5,S:5};

const FG={};[['qaz',0],['wsx',1],['edc',2],['rfvtgb',3],['yhnujm',3],['ik',2],['ol',1],['p',0]].forEach(a=>a[0].split('').forEach(k=>FG[k]=a[1]));

/* ================= selection / spaced repetition ================= */
function content(L,k){const w=WK[L.w];return(k=='L'?w.L:k=='S'?w.S:w.W)||[]}
function lpool(L,c){const k=kind(c);let a=content(L,k);if(!a.length)a=k=='L'?ABC:k=='S'?R(0,SEN.length-1):R(0,W.length-1);
 if(L.boss||L.i>=11||a.length<3)return a;
 const p=L.i<4?0:L.i<8?1:2,n=a.length,s=a.slice(Math.floor(n*p/3),Math.floor(n*(p+1)/3));return s.length?s:a}
function pri(u,k,x){const key=k+':'+x;return(u.p[key]||0)-2*(u.m[key]||0)+Math.random()*1.2}
function pickItems(u,k,pool,n){const s=pool.map(x=>[x,pri(u,k,x)]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);const r=[];for(let j=0;r.length<n;j++)r.push(s[j%s.length]);return r}
function review(u,k,pool,n){const inP=new Set(pool.map(String));const all=k=='L'?ABC:k=='S'?SEN.map((_,i)=>i):W.map((_,i)=>i);
 const c=all.filter(x=>!inP.has(String(x))&&(u.p[k+':'+x]||0)>0).map(x=>[x,(u.m[k+':'+x]||0)*2-(u.p[k+':'+x]||0)*.3+Math.random()]).sort((a,b)=>b[1]-a[1]).slice(0,6).map(a=>a[0]);
 return shuf(c).slice(0,n)}
function startLevel(n){
 const u=U(),L=LV[n-1];let items=[];
 if(L.boss){
  const w=WK[L.w],types=(w.bx||w.s.replace(/[XP]/g,'')).split('').filter((c,i,a)=>a.indexOf(c)==i);
  const seq=[];while(seq.length<10)seq.push(...shuf(types));seq.length=10;
  const cnt={};seq.forEach(c=>cnt[c]=(cnt[c]||0)+1);
  Object.keys(cnt).forEach(c=>{const k=kind(c);pickItems(u,k,lpool(L,c),cnt[c]).forEach(x=>items.push({c,x}))});
 }else{
  const c=L.c,k=kind(c),pool=lpool(L,c),Q=QN[c];
  if(c=='P'){for(let j=0;j<Q;j++){const top=pool.map(x=>[x,pri(u,'W',x)]).sort((a,b)=>a[1]-b[1]).slice(0,6).map(a=>a[0]);items.push({c,x:shuf(top).slice(0,4)})}}
  else{const rv=review(u,k,pool,L.i>=11?3:2);pickItems(u,k,pool,Q-rv.length).concat(rv).forEach(x=>items.push({c,x}))}
 }
 G={n,L,items:shuf(items),i:0,miss:0,mood:'neutral',re:[],reDone:0,retry:0,cmb:0,done:0,say:'',a:''};

/* ================= question builders ================= */
function scr(a){let t=shuf(a);for(let n=0;n<8&&a.length>1&&t.join('|')==a.join('|');n++)t=shuf(a);return t}
function wdist(x){const wl=G&&G.L?(WK[G.L.w].W||[]):[],pic=picOf(x);
 const cand=shuf(wl.filter(y=>y!=x&&picOf(y)!=pic)).concat(shuf(R(0,W.length-1).filter(y=>y!=x&&picOf(y)!=pic)));
 const r=[];cand.forEach(y=>{if(r.length<2&&r.indexOf(y)<0)r.push(y)});return r}
function mk(it){
 const c=it.c,x=it.x,q={c,x,k:kind(c),bad:0,t0:Date.now(),pos:0};
 if(c=='H'){q.ans=x;q.ch=shuf([x].concat(shuf(ABC.filter(y=>y!=x)).slice(0,2))).map(v=>({v,t:v.toUpperCase()+' '+v}))}
 else if(c=='U'){q.up=Math.random()<.5;q.shown=q.up?x.toUpperCase():x;const tr=v=>q.up?v:v.toUpperCase();q.ans=tr(x);
  q.ch=shuf([x].concat(shuf(ABC.filter(y=>y!=x)).slice(0,2))).map(v=>({v:tr(v),t:tr(v)}))}
 else if(c=='F'){const f=W[x][0][0].toLowerCase();q.ans=f;q.ch=shuf([f].concat(shuf(ABC.filter(y=>y!=f)).slice(0,2))).map(v=>({v,t:v.toUpperCase()+' '+v}))}
 else if(c=='M'){const w=W[x][0];q.gap=Math.random()*w.length|0;q.ans=w[q.gap].toLowerCase()}
 else if(c=='B'){q.tiles=scr(W[x][0].split(''));q.sel=[];q.target=W[x][0].split('')}
 else if(c=='W'||c=='D'){q.ans=W[x][0];q.ch=shuf([x].concat(wdist(x))).map(v=>({v:W[v][0],t:W[v][0]}))}
 else if(c=='P'){q.cards=shuf(x.map(i=>({w:i,t:'p'})).concat(x.map(i=>({w:i,t:'w'})))).map((cd,j)=>Object.assign(cd,{id:j}));q.open=[];q.matched=[]}
 else if(c=='C'||c=='E'){const s=SEN[x],toks=s[0].split(' '),tgt=toks[s[2]],verb=W[WI[tgt.toLowerCase()]][3]=='v';
  q.toks=toks;q.b=s[2];q.word=tgt;
  if(c=='C'){const ds=shuf((verb?SAFEN:SAFEV).filter(d=>toks.every(t=>t.toLowerCase()!=d))).slice(0,2);q.ans=tgt;q.ch=shuf([tgt].concat(ds)).map(v=>({v,t:v}))}}
 else if(c=='O'||c=='S'){const toks=SEN[x][0].split(' ');q.toks=toks;q.target=toks;q.tiles=scr(toks);q.sel=[]}
 return q}
function qkeys(q){return q.c=='P'?q.x.map(i=>'W:'+i):[q.k+':'+q.x]}

 return `<div class="bxs${small?' sm':''}">`+chars.map((ch,i)=>{let cl,tx='';
  if(gap!==undefined){if(i==gap){cl=G.fb?'ok':'cur';tx=G.fb?ch:''}else{cl='ok';tx=ch}}

 return '<div class="tl line" dir="ltr">'+q.sel.map(t=>`<button class="btn" style="background:var(--g)" ${undo?`data-a="untile" data-v="${t}"`:'disabled'}><span lang="en">${esc(q.tiles[t])}</span></button>`).join('')+'</div>'+

 if(c=='L'){b=`<div class="card c cardq"><div class="huge">${x.toUpperCase()} ${x}</div>${sayBtn(x)}</div>`+legend()+kb(x)}

 else if(c=='B'){const w=W[x][0];b=`<div class="card c cardq"><div class="pic">${picOf(x)}</div><p class="mut c">${W[x][2]}</p>${sayBtn(w)}${boxes(q.target,q.sel.length)}${tilesUI(q,0)}</div>`}
 else if(c=='Y'||c=='T'){const w=W[x][0];b=`<div class="card c cardq"><div class="pic">${picOf(x)}</div><p class="mut c">${W[x][2]}</p>${sayBtn(w)}${c=='Y'?`<div class="huge en" lang="en">${esc(w)}</div>`:''}${boxes(w.split(''),q.pos)}</div>`+kb(w.toLowerCase()[q.pos])}

 else if(c=='C'){const mid=G.fb?`<b class="fill">${esc(q.word)}</b>`:'<span class="gap"></span>';b=`<div class="card c cardq">${sentLine(q,mid)}<p class="mut c">${SEN[x][1]}</p></div>`+choices(q)}

function press(k){
 if(!G||G.lock||G.done)return;const q=G.q,c=q.c;
 if(c=='L'){k==q.x?ok():bad()}
 else if(c=='M'){k==q.ans?ok():bad()}
 else if(c=='T'||c=='Y'||c=='E'){
  const w=(c=='E'?q.word:W[q.x][0]).toLowerCase();
  if(k==w[q.pos]){q.pos++;G.hint=0;G.msg='';sfx('tick');if(q.pos>=w.length)ok();else{G.say=INS[c];vGame(true)}}else bad()}}
function pickChoice(i){
 if(!G||G.lock||G.dis.includes(i))return;const q=G.q;
 if(q.ch[i].v===q.ans)ok();else{G.dis.push(i);bad()}}
function tapTile(i){
 if(!G||G.lock)return;const q=G.q,c=q.c;if(q.sel.includes(i))return;
 const strict=c=='B'||c=='O';
 if(strict){if(q.tiles[i]!==q.target[q.sel.length]){bad();return}}
 q.sel.push(i);G.msg='';G.hint=0;
 if(q.sel.length==q.tiles.length){
  const r=q.sel.map(t=>q.tiles[t]).join(c=='B'?'':' ');
  const goal=c=='B'?W[q.x][0]:SEN[q.x][0];
  if(r===goal)ok();else{q.sel=[];bad()}
 }else{sfx('tick');vGame(true)}}
function untile(t){if(!G||G.lock)return;const q=G.q;q.sel=q.sel.filter(x=>x!=t);vGame(true)}
function cardTap(i){
 if(!G||G.lock)return;const q=G.q;if(q.busy)return;const cd=q.cards[i];
 if(q.matched.includes(cd.w)||q.open.includes(i))return;
 q.open.push(i);if(cd.t=='w')sp(W[cd.w][0]);
 if(q.open.length<2){vGame(true);return}
 const a=q.cards[q.open[0]],b=q.cards[q.open[1]];
 if(a.w==b.w&&a.t!=b.t){q.matched.push(a.w);q.open=[];sfx('tick');if(q.matched.length==q.x.length)ok();else vGame(true)}
 else{q.busy=1;const g=G;bad();setTimeout(()=>{if(G!==g||g.q!==q)return;q.open=[];q.busy=0;vGame(true)},950)}}
document.addEventListener('keydown',e=>{
 if(!G||G.done||/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 let k=null;const m=/^Key([A-Z])$/.exec(e.code||'');
 if(m)k=m[1].toLowerCase();else if(e.key&&e.key.length==1&&/[a-z]/i.test(e.key))k=e.key.toLowerCase();
 if(k&&'LMTYE'.includes(G.q.c)){e.preventDefault();press(k)}});

 const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push({k:td(d),w:'یدسچپجش'[d.getDay()]})}
 const mx=Math.max(10,...days.map(d=>(u.log[d.k]||{q:0}).q));
 const tq=Object.values(u.log).reduce((a,l)=>a+l.q,0),tw=Object.values(u.log).reduce((a,l)=>a+l.w,0),ts=Object.values(u.log).reduce((a,l)=>a+l.s,0);
 const chip=(t,w)=>`<span class="chip warn en">${esc(t)}</span>`;
 const wl=weak(u,'L',8).map(x=>chip(x.toUpperCase())).join('')||'<small class="mut">فعلاً مورد خاصی نیست 👍</small>';
 const ww=weak(u,'W',10).map(x=>chip(W[x][0])).join('')||'<small class="mut">فعلاً مورد خاصی نیست 👍</small>';
 const ws=weak(u,'S',5).map(x=>chip(SEN[x][0])).join('')||'<small class="mut">فعلاً مورد خاصی نیست 👍</small>';
 const lc=Object.keys(u.p).filter(k=>k[0]=='L'&&u.p[k]>0).length,wc=Object.keys(u.p).filter(k=>k[0]=='W'&&u.p[k]>0).length,sc=Object.keys(u.p).filter(k=>k[0]=='S'&&u.p[k]>0).length;
 set(`<div class="top"><button class="btn ghost sm" data-a="exit">⬅ برگشت</button><h2 style="margin:0">📊 گزارش ${esc(u.name)}</h2></div>`+
 `<div class="card"><b>خلاصه</b><p>مرحله‌ها: ${fa(Object.keys(u.lv).length)} از ${fa(TOT)} · ستاره: ${fa(u.stars)}<br>تا امروز: ${fa(tq)} پاسخ درست، ${fa(tw)} سؤال با اشتباه، حدود ${fa(Math.round(ts/60))} دقیقه تمرین${tq+tw?` · دقت ${fa(Math.round(tq/(tq+tw)*100))}٪`:''}<br>دیده‌شده: ${fa(lc)} حرف، ${fa(wc)} کلمه، ${fa(sc)} جمله</p></div>`+
 `<div class="card"><b>۷ روز اخیر (تعداد پاسخ درست)</b><div class="bars">${days.map(d=>{const l=u.log[d.k]||{q:0,s:0};return `<div><small>${fa(l.q)}</small><i style="height:${Math.round(l.q/mx*80)}%"></i><small>${d.w}</small></div>`}).join('')}</div></div>`+
 `<div class="card"><b>موردهای نیازمند تمرین بیشتر</b><p class="mut">این‌ها در مرحله‌های بعد زودتر برمی‌گردند.</p><div>حروف:</div><div class="chips">${wl}</div><div style="margin-top:8px">کلمه‌ها:</div><div class="chips">${ww}</div><div style="margin-top:8px">جمله‌ها:</div><div class="chips">${ws}</div></div>`+
 `<div class="card"><b>آزمون‌های هفتگی</b><div class="chips">${WK.map((w,i)=>`<span class="chip${u.ex[i]?' on':''}">${fa(i+1)} ${u.ex[i]?'★'.repeat(u.ex[i]):'—'}</span>`).join('')}</div></div>`+
 '<button class="btn ghost" data-a="bk">📦 پشتیبان‌گیری و بازیابی</button> <button class="btn ghost" id="dl" data-a="del">🗑️ حذف این بازیکن</button>')}
let delAsk=0;
function delU(){if(!delAsk){delAsk=1;$('#dl').textContent='⚠️ مطمئنی؟ دوباره بزن';return}
 S.users=S.users.filter(u=>u.id!==S.cur);S.cur=null;delAsk=0;save();vUsers()}
function vBk(){
 delAsk=0;
 set(`<div class="top"><button class="btn ghost sm" data-a="${U()?'exit':'users'}">⬅ برگشت</button><h2 style="margin:0">📦 پشتیبان‌گیری</h2></div>`+
 '<div class="card"><p>پیشرفت همهٔ بازیکن‌ها فقط روی همین مرورگر ذخیره می‌شود. یک فایل پشتیبان بگیر و جایی نگه دار.</p>'+
 '<button class="btn" data-a="dl">⬇️ دانلود فایل پشتیبان</button><button class="btn ghost" data-a="cp">📋 کپی کد پشتیبان</button>'+
 `<textarea id="ex" readonly aria-label="کد پشتیبان">${esc(JSON.stringify({v:2,users:S.users}))}</textarea></div>`+
 '<div class="card"><p>برای بازیابی، فایل پشتیبان را انتخاب کن یا کد را بچسبان:</p><input type="file" id="fl" accept=".json,application/json,text/plain" data-a="file"><textarea id="im" placeholder="{...}" aria-label="کد بازیابی"></textarea><button class="btn" data-a="rs">♻️ بازیابی از کد</button></div><div class="msg" id="bm" role="status"></div>')}
function bmsg(ok_,t){const m=$('#bm');if(m){m.className='msg '+(ok_?'ok':'no');m.textContent=t}}
function dlFile(){try{const b=new Blob([JSON.stringify({v:2,users:S.users})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='english-game-backup-'+td()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);bmsg(1,'✅ فایل دانلود شد')}catch(e){bmsg(0,'❌ دانلود ممکن نشد؛ از «کپی کد» استفاده کن')}}
function cpCode(){const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}bmsg(1,'✅ کپی شد')}
function importText(txt){
 try{let a=JSON.parse(String(txt).trim());if(a&&!Array.isArray(a)&&Array.isArray(a.users))a=a.users;if(!Array.isArray(a))throw 0;let c=0;
  a.forEach(n=>{if(!n||!n.id||!n.name)return;norm(n);const i=S.users.findIndex(u=>u.id===n.id);if(i<0)S.users.push(n);else S.users[i]=n;c++});
  save();bmsg(1,'✅ '+fa(c)+' بازیکن بازیابی شد')}catch(e){bmsg(0,'❌ کد یا فایل معتبر نیست')}}
function readFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(r.result);r.onerror=()=>bmsg(0,'❌ فایل خوانده نشد');r.readAsText(f)}

/* ================= actions ================= */
const A={
 login:id=>{S.cur=id;save();vHome()},
 newu:()=>{const n=$('#nm').value.trim();if(!n){$('#nm').focus();return}
  const u=norm({id:Date.now().toString(36),name:n,av:$('.av-b.on').textContent});S.users.push(u);S.cur=u.id;save();vHome()},
 av:(v,b)=>{document.querySelectorAll('.av-b').forEach(x=>x.classList.remove('on'));b.classList.add('on')},
 users:vUsers,exit:vHome,prog:vProg,bk:vBk,del:delU,dl:dlFile,cp:cpCode,
 rs:()=>importText($('#im').value),
 lv:v=>startLevel(+v),
 say:v=>sp(spk(v)),
 key:v=>press(v),
 pick:v=>pickChoice(+v),
 tile:v=>tapTile(+v),untile:v=>untile(+v),card:v=>cardTap(+v),
 mis:v=>{const u=U();if(!u.mis[v]){u.mis[v]=1;u.stars+=2;save();sfx('win');conf(40)}vHome()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName=='INPUT')return;const f=A[b.dataset.a];if(f)f(b.dataset.v,b)});
document.addEventListener('change',e=>{if(e.target.id=='fl')readFile(e.target)});

/* ================= effects ================= */
const CC=['#6c5ce7','#00b894','#fdcb6e','#e17055','#0984e3','#fd79a8'];
let MU=false,CALM=false,AC=null;
try{MU=localStorage.getItem('kidMute')=='1';CALM=localStorage.getItem('kidCalm')=='1'}catch(e){}
function conf(n){if(CALM)return;const d=document.createElement('div');d.className='cf';
 for(let i=0;i<n;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;background:${CC[i%6]};--x:${(Math.random()-.5)*300}px;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.25}s;animation-duration:${1+Math.random()*.9}s`;d.appendChild(s)}
 document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function sfx(t){if(MU)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const N={ok:[[660,.1],[880,.15]],no:[[200,.22]],tick:[[520,.05]],win:[[523,.12],[659,.12],[784,.12],[1047,.3]]}[t];let at=AC.currentTime;
 N.forEach(n=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t=='no'?'sawtooth':'triangle';o.frequency.value=n[0];g.gain.setValueAtTime(.12,at);g.gain.exponentialRampToValueAtTime(.001,at+n[1]);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+n[1]);at+=n[1]*.9})}catch(e){}}
function fab(txt,pos,title,fn){const b=document.createElement('button');b.className='fab';b.style.left=pos;b.title=title;b.setAttribute('aria-label',title);b.textContent=txt;b.onclick=fn;document.body.appendChild(b);return b}
const mb=fab(MU?'🔇':'🔊','10px','صدای افکت‌ها',()=>{MU=!MU;mb.textContent=MU?'🔇':'🔊';try{localStorage.setItem('kidMute',MU?'1':'0')}catch(e){}});
const cb=fab(CALM?'🌿':'🎉','64px','حالت آرام (بدون حرکت و کانفتی)',()=>{CALM=!CALM;document.body.classList.toggle('calm',CALM);cb.textContent=CALM?'🌿':'🎉';try{localStorage.setItem('kidCalm',CALM?'1':'0')}catch(e){}});
if(CALM)document.body.classList.add('calm');
if(S.cur&&U())vHome();else vUsers();
</script>
</body>
</html>
